name: RBD OFIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  compliance:
    name: License & Privacy Compliance (ADR-0003)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required governance documents
        run: |
          test -f LICENSE
          test -f AGENTS.md
          test -f THIRD_PARTY.md
          test -f docs/adr/0003-yayin-uyumlulugu.md
      - name: Scan for forbidden telemetry / proprietary SDKs
        run: |
          if grep -RInE "(com\.google\.firebase|com\.google\.mlkit|com\.google\.android\.gms\.ads|applicationinsights|sentry\.io)" core/ apps/ 2>/dev/null; then
            echo "ERROR: Forbidden telemetry or proprietary SDK reference detected!"
            exit 1
          fi

  rust-core:
    name: Rust Core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Fetch PDFium native library for Linux / macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p core/vendor/pdfium/bin
          if [ "$RUNNER_OS" = "Linux" ]; then
            curl -sSL https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz | tar -xz -C core/vendor/pdfium
            cp -f core/vendor/pdfium/lib/libpdfium.so core/vendor/pdfium/bin/libpdfium.so
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ARCH=$(uname -m)
            if [ "$ARCH" = "arm64" ]; then
              ASSET="pdfium-mac-arm64.tgz"
            else
              ASSET="pdfium-mac-x64.tgz"
            fi
            curl -sSL "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${ASSET}" | tar -xz -C core/vendor/pdfium
            cp -f core/vendor/pdfium/lib/libpdfium.dylib core/vendor/pdfium/bin/libpdfium.dylib
          fi
      - name: Cache test corpus files
        uses: actions/cache@v4
        with:
          path: corpus/files
          key: corpus-files-${{ hashFiles('corpus/manifest.json') }}
      - name: Generate & fetch test corpus
        run: |
          python corpus/generate.py
          python corpus/fetch.py --category pdf-basic
          python corpus/fetch.py --category pdf-corrupt
          python corpus/fetch.py --category pdf-encrypted
          python corpus/fetch.py --category pdf-annotations
          python corpus/fetch.py --category pdf-pdfa
          python corpus/fetch.py --category pdf-signed
          python corpus/fetch.py --category pdf-forms
      - name: Check formatting
        working-directory: core
        run: cargo fmt --all -- --check
      - name: Run Clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust Core Tests
        working-directory: core
        run: cargo test --all-targets

  windows-app:
    name: Windows App (.NET 9)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Cache test corpus files
        uses: actions/cache@v4
        with:
          path: corpus/files
          key: corpus-files-${{ hashFiles('corpus/manifest.json') }}
      - name: Fetch basic test corpus for live FFI test
        run: |
          python corpus/generate.py
          python corpus/fetch.py --category pdf-basic
      - name: Build rbd-ffi native DLL
        working-directory: core
        run: cargo build --release -p rbd-ffi
      - name: Build Windows Solution
        working-directory: apps/windows
        run: dotnet build RbdOfis.sln --configuration Release
      - name: Ensure native DLLs are in test output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "apps/windows/RbdOfis.Windows.Tests/bin/Release/net9.0"
          if (Test-Path "core/target/release/rbd_ffi.dll") {
            Copy-Item "core/target/release/rbd_ffi.dll" -Destination "apps/windows/RbdOfis.Windows.Tests/bin/Release/net9.0/" -Force
          }
          if (Test-Path "core/vendor/pdfium/bin/pdfium.dll") {
            Copy-Item "core/vendor/pdfium/bin/pdfium.dll" -Destination "apps/windows/RbdOfis.Windows.Tests/bin/Release/net9.0/" -Force
          }
      - name: Run Windows Unit & Live FFI Tests
        working-directory: apps/windows
        run: dotnet test RbdOfis.Windows.Tests/RbdOfis.Windows.Tests.csproj --configuration Release --verbosity normal

  android-app:
    name: Android App (Gradle & Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Grant execute permission for gradlew
        working-directory: apps/android
        run: chmod +x gradlew
      - name: Run Android Unit Tests
        working-directory: apps/android
        run: ./gradlew runUnitTests --no-daemon
